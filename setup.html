<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up Northstar</title><style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#263a31;background:#eef2ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#d7e5dc,transparent 38%),#f2f3f0}.card{width:min(100%,560px);background:#fff;border:1px solid #e5e9e5;border-radius:18px;box-shadow:0 24px 80px #273d3017;padding:42px 48px}.brand{font:italic 42px Georgia,serif;color:#a36b19;text-align:center;margin-bottom:4px}.diamond{text-align:center;color:#c58b35;font-size:18px;margin-bottom:26px}.eyebrow{text-align:center;letter-spacing:.2em;font-size:10px;font-weight:800;color:#b17a2a}.title{text-align:center;font-size:28px;margin:12px 0 8px;color:#344c40}.intro{text-align:center;color:#77847c;font-size:14px;line-height:1.55;margin:0 auto 26px;max-width:400px}.step{font-size:12px;font-weight:700;color:#728076;margin:0 0 16px}.field{display:block;margin:0 0 16px;font-size:12px;color:#69776d}.field input{display:block;width:100%;margin-top:7px;padding:13px 12px;border:1px solid #d9dfda;border-radius:8px;font:15px "Segoe UI",Arial,sans-serif;color:#25352b;outline:none}.field input:focus{border-color:#a8752e;box-shadow:0 0 0 3px #c58b351c}.submit{width:100%;border:0;border-radius:28px;background:#294537;color:white;padding:15px;font-size:15px;font-weight:700;cursor:pointer;margin-top:7px}.submit:disabled{opacity:.65;cursor:wait}.error,.success{min-height:20px;margin:0 0 12px;color:#bd4038;font-size:13px}.success{color:#26734a}.foot{text-align:center;color:#8b958e;font-size:12px;margin-top:24px}@media(max-width:520px){.card{padding:32px 23px}.brand{font-size:36px}}
</style></head><body><main class="card"><div class="brand" id="brand">Northstar</div><div class="diamond">◇</div><div class="eyebrow">FIRST-TIME SETUP</div><h1 class="title">Set up your workspace</h1><p class="intro">Add your company details and create the first administrator account to finish installation.</p><form id="setupForm"><p class="step">Company and administrator</p><label class="field">Company name<input name="company" required maxlength="120" autocomplete="organization" placeholder="Your company"></label><label class="field">Administrator full name<input name="full_name" required maxlength="120" autocomplete="name" placeholder="Your name"></label><label class="field">Administrator username<input name="username" required minlength="3" maxlength="80" pattern="[A-Za-z0-9._@-]{3,80}" autocomplete="username" placeholder="Choose a username"></label><label class="field">Password<input name="password" type="password" required minlength="10" autocomplete="new-password" placeholder="At least 10 characters"></label><label class="field">Confirm password<input name="confirm" type="password" required minlength="10" autocomplete="new-password" placeholder="Enter the password again"></label><p class="error" id="message" role="alert" aria-live="polite"></p><button class="submit" id="submit" type="submit">Finish setup&nbsp; →</button></form><div class="foot">You can customize sign-in branding later in Settings.</div></main><script>
const form=document.getElementById('setupForm'),message=document.getElementById('message'),button=document.getElementById('submit');fetch('/api/login-branding').then(r=>r.ok?r.json():null).then(b=>{if(b?.companyName)document.getElementById('brand').textContent=b.companyName}).catch(()=>{});fetch('/api/setup/status').then(r=>r.json()).then(s=>{if(s.configured)location.replace('/')}).catch(()=>{});form.addEventListener('submit',async e=>{e.preventDefault();message.className='error';message.textContent='';const d=Object.fromEntries(new FormData(form));if(d.password!==d.confirm){message.textContent='Passwords do not match.';return}button.disabled=true;button.textContent='Setting up…';try{const r=await fetch('/api/setup',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'NorthstarIT'},body:JSON.stringify({company:d.company,full_name:d.full_name,username:d.username,password:d.password})});const body=await r.json();if(!r.ok)throw new Error(body.error||'Setup could not be completed.');message.className='success';message.textContent='Setup complete. Opening sign in…';location.assign('/')}catch(err){message.textContent=err.message;button.disabled=false;button.textContent='Finish setup →'}});
</script></body></html>
